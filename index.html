<!DOCTYPE html>
<html lang="es">
<head>

</head>
<body>

            </div>
        </header>
        <main>
            <form action="info.html" method="get">
                <section id="dades-personals">

                </section>
                <section id="informacio-academica">

                </section>

                </section>

                    <input type="checkbox" id="politica" required>

            <p>Model visual de referència. No cal que els botons enviin informació ni que el formulari tingui connexió amb un servidor.</p>
